<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

#content{
    text-align:center;
}

.youtube-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
}

.youtube-box img{
    width:120px;
    max-width:80%;
    user-select:none;
    -webkit-user-drag:none;
}

.youtube-btn{
    background:#ff0000;
    color:#fff;
    border:none;
    padding:16px 28px;
    font-size:18px;
    font-weight:bold;
    border-radius:12px;
    cursor:pointer;
    transition:0.2s;
    box-shadow:0 0 20px rgba(255,0,0,0.5);
}

.youtube-btn:active{
    transform:scale(0.96);
}
</style>
</head>

<body>

<div id="content">Loading...</div>

<script>

/* CHECK FACEBOOK IN-APP */
function isFacebookApp(){
    let ua = navigator.userAgent || "";
    return ua.includes("FBAN") || ua.includes("FBAV");
}

/* RUN NGAY */
(function(){

    if(isFacebookApp()){

        document.getElementById("content").innerHTML = `
            <div class="youtube-box">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/YouTube_full-color_icon_%282017%29.svg/1280px-YouTube_full-color_icon_%282017%29.svg.png">
                
                <button class="youtube-btn" onclick="openYoutube()">
                    XEM NGAY TRÊN YOUTOBE
                </button>
            </div>
        `;

    }else{

        // trình duyệt thường → hiện 404
        document.getElementById("content").innerText = "404";

    }

})();

function openYoutube(){
    window.location.href = "https://s.shopee.vn/LjyjXobff";
}

/* chặn chuột phải */
document.addEventListener('contextmenu', e => e.preventDefault());

/* chặn phím dev */
document.onkeydown = function(e) {
    if (e.keyCode == 123) return false;
    if (e.ctrlKey && e.shiftKey && e.keyCode == 73) return false;
    if (e.ctrlKey && e.shiftKey && e.keyCode == 74) return false;
    if (e.ctrlKey && e.keyCode == 85) return false;
    if (e.ctrlKey && e.keyCode == 83) return false;
};

</script>

</body>
</html>
