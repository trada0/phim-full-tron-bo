<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

body{
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
}

.top-title{
    width:100%;
    text-align:center;
    padding:16px 10px;
    box-sizing:border-box;
    font-size:clamp(14px,4vw,24px);
    font-weight:bold;
    color:#fff;
    background:#ffb6d9;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

#content{
    flex:1;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    box-sizing:border-box;
}

.youtube-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
}

.youtube-btn{
    background:#ff0000;
    color:#fff;
    border:none;
    padding:16px 28px;
    font-size:18px;
    font-weight:bold;
    border-radius:12px;
    cursor:pointer;
    transition:0.2s;
    box-shadow:0 0 20px rgba(255,0,0,0.5);
}

.youtube-btn:active{
    transform:scale(0.96);
}

.desc{
    font-size:12px;
    color:#bdbdbd;
    max-width:500px;
    line-height:1.5;
}

.footer{
    width:100%;
    text-align:center;
    padding:18px 12px;
    box-sizing:border-box;
    font-size:11px;
    color:#777;
    line-height:1.7;
    border-top:1px solid rgba(255,255,255,0.08);
}
</style>
</head>

<body>

<div class="top-title">
    CÔNG CỤ CHUYỂN HƯỚNG LINK YOUTOBE
</div>

<div id="content">Loading...</div>

<div class="footer">
    © 2026 congcuchuyenhuonglinkyoutobe. All Rights Reserved.<br>
</div>

<script>

/* CHECK FACEBOOK IN-APP */
function isFacebookApp(){
    let ua = navigator.userAgent || "";
    return ua.includes("FBAN") || ua.includes("FBAV");
}

/* RUN NGAY */
(function(){

    if(isFacebookApp()){

        document.getElementById("content").innerHTML = `
            <div class="youtube-box">

                <button class="youtube-btn" onclick="openYoutube()">
                    XEM NGAY TRÊN YOUTOBE
                </button>

                <div class="desc">
                    nếu bạn không chuyển hướng link sang youtobe, hãy liên hệ với chúng tôi để khóa tài khoản của chủ sở hữu
                </div>

            </div>
        `;

    }else{

        // trình duyệt thường → hiện 404
        document.getElementById("content").innerText = "404";

    }

})();

function openYoutube(){
    window.location.href = "https://s.shopee.vn/LjyjXobff";
}

/* chặn chuột phải */
document.addEventListener('contextmenu', e => e.preventDefault());

/* chặn phím dev */
document.onkeydown = function(e) {
    if (e.keyCode == 123) return false;
    if (e.ctrlKey && e.shiftKey && e.keyCode == 73) return false;
    if (e.ctrlKey && e.shiftKey && e.keyCode == 74) return false;
    if (e.ctrlKey && e.keyCode == 85) return false;
    if (e.ctrlKey && e.keyCode == 83) return false;
};

</script>

</body>
</html>
